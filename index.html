<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[7A6 WORKSPACE] - Lắp Ráp Lời Chúc 20/11 [Upgraded]</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
            color: #c9d1d9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            justify-content: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: rgba(22, 27, 34, 0.95);
            border: 1px solid #30363d;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            text-align: center;
        }
        h2 { color: #58a6ff; margin-bottom: 10px; }
        p { color: #8b949e; font-size: 14px; margin-bottom: 20px; }
        
        .drop-zone {
            min-height: 70px;
            border: 2px dashed #30363d;
            border-radius: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 15px;
            align-items: center;
            justify-content: center;
            background: #0d1117;
            margin-bottom: 20px;
            transition: border-color 0.3s;
        }
        .placeholder-text { color: #484f58; font-style: italic; }
        
        .word-pool {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }
        .word-chip {
            background: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 10px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
            user-select: none;
        }
        .word-chip:hover { background: #30363d; border-color: #58a6ff; transform: translateY(-2px); }
        .word-chip.used { opacity: 0.25; pointer-events: none; transform: scale(0.95); }
        
        .chip-in-zone {
            background: #1f6feb;
            color: white;
            padding: 8px 14px;
            border-radius: 16px;
            cursor: pointer;
            font-weight: 600;
            animation: popIn 0.3s ease;
            box-shadow: 0 3px 10px rgba(31, 111, 235, 0.4);
        }
        .chip-in-zone:hover { background: #388bfd; }
        
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .action-group {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .btn {
            padding: 12px 20px;
            font-size: 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            border: none;
            transition: 0.2s;
        }
        .reset-btn { background: #6e7681; color: white; }
        .reset-btn:hover { background: #8b949e; }
        
        .next-btn {
            background: #238636;
            color: white;
            flex-grow: 1;
            display: none;
            box-shadow: 0 4px 15px rgba(35, 134, 54, 0.4);
        }
        .next-btn:hover { background: #2ea043; }
    </style>
</head>
<body>

    <div class="container">
        <h2>✨ Thử Thách Nhỏ Tặng Cô ✨</h2>
        <p>Cô hãy bấm chọn các từ bên dưới theo đúng thứ tự để lắp ráp câu chúc ý nghĩa từ tập thể lớp 7A6 nhé!</p>

        <div class="drop-zone" id="dropZone">
            <span class="placeholder-text" id="placeholder">Bấm vào các từ bên dưới để lắp ráp câu chúc...</span>
        </div>

        <div class="word-pool" id="wordPool"></div>

        <div class="action-group">
            <button class="btn reset-btn" onclick="resetPuzzle()">🔄 Làm lại</button>
            <button class="btn next-btn" id="nextBtn" onclick="goToGame3()">🎉 MỞ KHÓA TRANG CUỐI 🚀</button>
        </div>
    </div>

    <script>
        // 🎵 Âm thanh Web Audio API
        function playSound(type) {
            try {
                let ctx = new (window.AudioContext || window.webkitAudioContext)();
                let osc = ctx.createOscillator();
                let gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'click') {
                    osc.frequency.setValueAtTime(440, ctx.currentTime);
                    gain.gain.setValueAtTime(0.05, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.1);
                } else if (type === 'success') {
                    osc.frequency.setValueAtTime(587.33, ctx.currentTime);
                    osc.frequency.setValueAtTime(880, ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.4);
                }
            } catch(e) {}
        }

        const rawWords = [
            { id: "3", text: "luôn mạnh khỏe," },
            { id: "1", text: "Tập thể lớp 7A6" },
            { id: "5", text: "thật nhiều niềm vui!" },
            { id: "2", text: "kính chúc cô" },
            { id: "4", text: "hạnh phúc và" }
        ];

        const correctOrder = ["1", "2", "3", "4", "5"];
        let currentSelected = [];

        const wordPool = document.getElementById('wordPool');
        const dropZone = document.getElementById('dropZone');
        const placeholder = document.getElementById('placeholder');
        const nextBtn = document.getElementById('nextBtn');

        // 🔀 Xáo trộn ngẫu nhiên kho từ khi tải trang
        function initPool() {
            wordPool.innerHTML = '';
            let shuffled = [...rawWords].sort(() => Math.random() - 0.5);
            shuffled.forEach(item => {
                const chip = document.createElement('div');
                chip.className = 'word-chip';
                chip.setAttribute('data-id', item.id);
                chip.innerText = item.text;
                chip.onclick = function() {
                    playSound('click');
                    currentSelected.push({ id: item.id, text: item.text, element: chip });
                    chip.classList.add('used');
                    renderDropZone();
                    checkResult();
                };
                wordPool.appendChild(chip);
            });
        }

        function renderDropZone() {
            dropZone.innerHTML = '';
            if (currentSelected.length === 0) {
                dropZone.appendChild(placeholder);
                return;
            }

            currentSelected.forEach((item, index) => {
                const chip = document.createElement('div');
                chip.className = 'chip-in-zone';
                chip.innerText = item.text;
                chip.onclick = function() {
                    playSound('click');
                    item.element.classList.remove('used');
                    currentSelected.splice(index, 1);
                    renderDropZone();
                    checkResult();
                };
                dropZone.appendChild(chip);
            });
        }

        function checkResult() {
            const userOrder = currentSelected.map(item => item.id);
            if (userOrder.length === correctOrder.length) {
                const isCorrect = userOrder.every((val, index) => val === correctOrder[index]);
                if (isCorrect) {
                    playSound('success');
                    confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });
                    nextBtn.style.display = 'block';
                    dropZone.style.borderColor = '#238636';
                } else {
                    dropZone.style.borderColor = '#f85149';
                    setTimeout(() => { dropZone.style.borderColor = '#30363d'; }, 600);
                    nextBtn.style.display = 'none';
                }
            } else {
                nextBtn.style.display = 'none';
                dropZone.style.borderColor = '#30363d';
            }
        }

        function resetPuzzle() {
            playSound('click');
            currentSelected = [];
            initPool();
            renderDropZone();
            nextBtn.style.display = 'none';
            dropZone.style.borderColor = '#30363d';
        }

        function goToGame3() {
            document.body.innerHTML = `
                <div style="text-align: center; color: #58a6ff; font-family: monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh;">
                    <h2>✨ ĐÃ XÁC THỰC THÀNH CÔNG! ✨</h2>
                    <p style="color: #c9d1d9;">Đang mở kho báu cuối cùng dành tặng cô...</p>
                </div>
            `;
            setTimeout(() => { 
                window.location.href = "game3.html"; 
            }, 1200);
        }

        // Khởi chạy lần đầu
        initPool();
    </script>
</body>
</html>
